name: Create release

# Creates the tag v<version> and a GitHub release, as soon as a new version
# number (VERSION in plugindrmdevice.cpp) arrives on main and the build, the
# unit tests and the static analysis of this commit succeeded. The release
# notes are the section of this version in HISTORY.

on:
  # runs after each of these workflows, the release is created after the last one
  workflow_run:
    workflows:
      - Build vdr-plugin-drmdevice
      - Unit tests
      - Static analysis
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # read the results of the other workflows and start the documentation

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^static const char \*const VERSION *= *"\([^"]*\)".*/\1/p' plugindrmdevice.cpp)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No valid version found in plugindrmdevice.cpp: '$version'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "Tag v$version already exists, nothing to do"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the workflows of the commit
        id: checks
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ready=true
          for workflow in c-cpp.yml tests.yml static-analysis.yml; do
            conclusion=$(gh run list --workflow "$workflow" --commit "$SHA" --event push \
              --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            echo "$workflow: ${conclusion:-not finished}"
            if [ "$conclusion" != "success" ]; then
              ready=false
            fi
          done

          if [ "$ready" = false ]; then
            echo "::notice::No release of $SHA (yet): not all workflows succeeded"
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from HISTORY
        if: steps.checks.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            /^[0-9]+-[0-9]+-[0-9]+: Version / { found = ($NF == version); next }
            found
          ' HISTORY | sed -e '/./,$!d' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::HISTORY has no entry for version $VERSION"
            exit 1
          fi

          cat release-notes.md

      - name: Create tag and release
        if: steps.checks.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target "$SHA" \
            --title "Version $VERSION" \
            --notes-file release-notes.md

      - name: Generate the documentation with the version of the tag
        if: steps.checks.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the documentation of this commit was generated before the tag existed,
          # it is generated again, if main is still at the tagged commit
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SHA" ]; then
            gh workflow run doxygen.yml --ref main
          fi
