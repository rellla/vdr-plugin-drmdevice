name: Build vdr-plugin-drmdevice

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'DEVELOPER/**'
      - 'doxygen/**'
      - 'LICENSE.md'
      - '.github/dependabot.yml'
      - '.github/workflows/doxygen.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'DEVELOPER/**'
      - 'doxygen/**'
      - 'LICENSE.md'
      - '.github/dependabot.yml'
      - '.github/workflows/doxygen.yml'
  workflow_dispatch:

permissions:
  contents: read

# cancel outdated runs of the same branch/pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC, OpenGL/ES
            cxx: g++
            gles: 1
            check-i18n: true
            artifact: vdr-drmdevice
          - name: GCC, no OpenGL/ES
            cxx: g++
            gles: 0
            artifact: vdr-drmdevice-no-gles
          # the latest releases of the older VDR versions
          - name: GCC, OpenGL/ES, VDR 2.6
            cxx: g++
            gles: 1
            vdr-ref: '2.6'
          - name: GCC, OpenGL/ES, VDR 2.4
            cxx: g++
            gles: 1
            vdr-ref: '2.4'

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7
        with:
          path: drmdevice

      - name: Set up build environment
        uses: ./drmdevice/.github/actions/setup-build-env
        with:
          vdr-ref: ${{ matrix.vdr-ref }}

      - name: Build plugin
        run: |
          make -C vdr/PLUGINS/src/drmdevice -j"$(nproc)" \
            CXX=${{ matrix.cxx }} GLES=${{ matrix.gles }} \
            INCLUDES="-isystem $PWD/vdr/include -Werror"

      - name: Check translation files
        if: matrix.check-i18n
        working-directory: vdr/PLUGINS/src/drmdevice
        run: |
          if ! git diff --quiet -- po/*.po; then
            echo "::error::The translation files need to be updated:"
            git --no-pager diff -- po/*.po
            exit 1
          fi

      - name: Upload build artifacts
        if: matrix.artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: vdr/PLUGINS/src/drmdevice/libvdr-drmdevice.so
          if-no-files-found: error

  build-debian-testing:
    # catches API changes of upcoming FFmpeg, libdrm and compiler versions early
    name: Build (Debian testing, GCC, OpenGL/ES)
    runs-on: ubuntu-24.04
    container: debian:testing

    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates

      - name: Checkout plugin repository
        uses: actions/checkout@v7
        with:
          path: drmdevice

      - name: Set up build environment
        uses: ./drmdevice/.github/actions/setup-build-env

      - name: Build plugin
        run: |
          make -C vdr/PLUGINS/src/drmdevice -j"$(nproc)" GLES=1 \
            INCLUDES="-isystem $PWD/vdr/include -Werror"
